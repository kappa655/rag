<svg width="980" height="620" viewBox="0 0 980 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cat fact retrieval pipeline">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef6ff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#94a3b8" flood-opacity="0.25"/>
    </filter>
    <style>
      .title { font: 700 32px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .box-title { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .body { font: 16px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .tiny { font: 14px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .node { filter: url(#shadow); }
    </style>
  </defs>

  <rect width="980" height="620" fill="url(#bg)"/>
  <text x="490" y="58" text-anchor="middle" class="title">Cat Fact Retrieval Pipeline</text>

  <rect class="node" x="60" y="110" width="170" height="120" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="145" y="150" text-anchor="middle" class="box-title">Source</text>
  <text x="145" y="180" text-anchor="middle" class="body">cat-facts.txt</text>
  <text x="145" y="205" text-anchor="middle" class="tiny">one fact per line</text>

  <rect class="node" x="290" y="110" width="200" height="120" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="390" y="150" text-anchor="middle" class="box-title">Embedding</text>
  <text x="390" y="180" text-anchor="middle" class="body">SentenceTransformer</text>
  <text x="390" y="205" text-anchor="middle" class="tiny">all-MiniLM-L6-v2</text>

  <rect class="node" x="550" y="110" width="210" height="120" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="655" y="150" text-anchor="middle" class="box-title">Vector Store</text>
  <text x="655" y="180" text-anchor="middle" class="body">ChromaDB</text>
  <text x="655" y="205" text-anchor="middle" class="tiny">collection: cat_facts</text>

  <rect class="node" x="120" y="310" width="220" height="150" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="230" y="350" text-anchor="middle" class="box-title">User query</text>
  <text x="230" y="385" text-anchor="middle" class="body">“What do cats like?”</text>
  <text x="230" y="410" text-anchor="middle" class="tiny">text input</text>

  <rect class="node" x="400" y="310" width="210" height="150" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="505" y="350" text-anchor="middle" class="box-title">Similarity search</text>
  <text x="505" y="385" text-anchor="middle" class="body">encode + query</text>
  <text x="505" y="410" text-anchor="middle" class="tiny">top-k relevant facts</text>

  <rect class="node" x="670" y="310" width="220" height="150" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="780" y="350" text-anchor="middle" class="box-title">Prompt + LLM</text>
  <text x="780" y="385" text-anchor="middle" class="body">facts + question</text>
  <text x="780" y="410" text-anchor="middle" class="tiny">Ollama (llama3.2:1b)</text>

  <rect class="node" x="580" y="520" width="400" height="60" rx="18" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="780" y="558" text-anchor="middle" class="box-title">Answer</text>

  <path class="arrow" d="M230 170 H290"/>
  <path class="arrow" d="M490 170 H550"/>
  <path class="arrow" d="M655 230 L505 310"/>
  <path class="arrow" d="M340 385 H400"/>
  <path class="arrow" d="M610 385 H670"/>
  <path class="arrow" d="M780 460 V520"/>
</svg>
